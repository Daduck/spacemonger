name: Build and Test

on:
  push:
    branches: [ "main", "master", "daduck", "e-gaulue" ]
  pull_request:
    branches: [ "main", "master", "daduck", "e-gaulue" ]

jobs:
  build:
    runs-on: windows-2022

    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake --preset vs2022-win32

    - name: Build
      run: cmake --build --preset vs2022-win32-${{ matrix.configuration == 'Debug' && 'debug' || 'release' }}

    - name: Test
      run: ctest --preset vs2022-win32-${{ matrix.configuration == 'Debug' && 'debug' || 'release' }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-${{ matrix.configuration }}
        path: |
          build/vs2022-win32/**/*.exe
          build/vs2022-win32/**/*.dll
